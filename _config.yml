# ==============================================================================
# SITE CONFIGURATION (_config.yml)
# ==============================================================================
# 📝 ACADEMICIANS: Edit the personal information in this top section to setup
# your website. Once edited, simply push your repository to deploy!
# ==============================================================================

# 1. Personal & Academic Profile
title: "Can Bekcan"
author: "Can Bekcan"
email: "can.bekcan@emu.edu.tr"
description: "Academic CV & Research Portfolio - Eastern Mediterranean University"
institution: "Eastern Mediterranean University"
faculty: "Faculty of Communication and Media Studies"
department: "Department of New Media and Journalism"
fields: "New Media and Communnnication"
keywords: ["Computational Methods", "Digital Media", "Network Analysis"]
country: "Turkish Republic of Northern Cyprus"
avatar: "https://github.canbekcan.com/assets/images/Can-Bekcan-PADI.jpg"

# 2. Site URL & Hosting
# - Custom domain or user site (e.g. username.github.io):  baseurl: ""          | url: "https://example.com"
# - Project site (e.g. username.github.io/repo):           baseurl: "/Academy"  | url: "https://BanaBirSebepVer.github.io"
baseurl: ""
url: "https://github.canbekcan.com"
repository: "canbekcan/canbekcan"
github_repo: "https://github.com/canbekcan/canbekcan"
google_analytics: ""
encoding: utf-8
favicon: "/assets/images/favicon.ico"

# 3. Multilingual Settings
default_lang: "tr"
languages: ["tr", "en"]

# 4. AI & Machine Readability
# Automated LLM context manifest is served at /llms.txt and /llms-full.txt
# Structured AI knowledge endpoint is served at /ai.json
# Standard robots.txt with mandatory citation requirements is served at /robots.txt
ai_citation_required: true

# 5. Community Open Analytics
# Anonymously shares page visit counts to the public dashboard at academy.banabirsebepver.com.
# Set enabled: false to disable all tracking.
analytics:
  enabled: true
  endpoint: "https://academy.banabirsebepver.com"
  tracker_path: "/api/event.php"
  register_path: "/api/register.php"
  dashboard_url: "https://academy.banabirsebepver.com"

# ==============================================================================
# FRAMEWORK & ARCHITECTURE SETTINGS (No need to edit below this line)
# ==============================================================================

markdown: kramdown
future: true
kramdown:
  input: GFM
  hard_wrap: false

permalink: /yazilar/:year/:month/:day/:title/

# Collections Registration
collections:
  posts:
    output: true
  lessons:
    output: true
  publications:
    output: true
  project:
    output: true
  educations:
    output: false
  awards:
    output: false
  academic_positions:
    output: false
  conferences:
    output: false
  experiences:
    output: false
  memberships:
    output: false
  certificates:
    output: false
  person:
    output: false

# Scoped Defaults for Automated Language & Routing Assignment
defaults:
  # --- Lessons ---
  - scope:
      path: "_lessons/tr"
      type: "lessons"
    values:
      layout: "lesson"
      lang: "tr"
      permalink: "/dersler/:name/"
  - scope:
      path: "_lessons/en"
      type: "lessons"
    values:
      layout: "lesson"
      lang: "en"
      permalink: "/en/lessons/:name/"

  # --- Posts ---
  - scope:
      path: "_posts/tr"
      type: "posts"
    values:
      layout: "post/single"
      lang: "tr"
      permalink: "/yazilar/:year/:month/:day/:title/"
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      layout: "post/single"
      lang: "en"
      permalink: "/en/posts/:year/:month/:day/:title/"

  # --- Publications ---
  - scope:
      path: "_publications/tr"
      type: "publications"
    values:
      layout: "publication/single"
      lang: "tr"
      permalink: "/yayinlar/:name/"
  - scope:
      path: "_publications/en"
      type: "publications"
    values:
      layout: "publication/single"
      lang: "en"
      permalink: "/en/publications/:name/"

  # --- Project Items ---
  - scope:
      path: "_project/tr"
      type: "project"
    values:
      layout: "project/single"
      lang: "tr"
      permalink: "/projeler/:name/"
  - scope:
      path: "_project/en"
      type: "project"
    values:
      layout: "project/single"
      lang: "en"
      permalink: "/en/projects/:name/"

  # --- Pages ---
  - scope:
      path: "pages/tr"
    values:
      layout: "page"
      lang: "tr"
  - scope:
      path: "pages/en"
    values:
      layout: "page"
      lang: "en"

# Core Jekyll Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Ignored Files & Directories
exclude:
  - Gemfile
  - Gemfile.lock
  - _config-local.yml
  - _config-EXAMPLE.yml
  - README.md
  - AI.md
  - ARCHITECTURE.md
  - CONTRIBUTING.md
  - LICENSE
  - TASK.md
  - migrate.sh
  - tree.txt
  - serve.sh
  - scripts/
  - .github/
  - node_modules
  - vendor
  - .DS_Store
