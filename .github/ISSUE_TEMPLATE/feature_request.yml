name: "✨ Feature Request"
description: Suggest an enhancement, new layout module, or feature
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Proposed Feature
      description: What would you like to see added to the Academy theme?
      placeholder: Describe the component, layout, or automation workflow...
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Academic / Practical Use Case
      description: How will this help scholars, courses, or departments using the theme?
    validations:
      required: true