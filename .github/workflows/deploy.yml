name: Deploy Academy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow releases to finish safely.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages with least-privilege security
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Jekyll Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Jekyll Source Directory
        id: detect-source
        run: echo "path=./" >> $GITHUB_OUTPUT

      - name: Generate Build Version & Update Metrics
        id: version-generator
        run: |
          TARGET_DIR="${{ steps.detect-source.outputs.path }}"
          DATA_DIR="${TARGET_DIR}/_data"
          mkdir -p "${DATA_DIR}"

          # Extract Git Version Metadata
          SHORT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          TAG_NAME=$(git describe --tags --always 2>/dev/null || echo "${SHORT_COMMIT}")
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")

          # Calculate commit distance from primary upstream repository
          BEHIND_COUNT=0
          CURRENT_REPO="${GITHUB_REPOSITORY}"
          UPSTREAM_REPO="BanaBirSebepVer/Academy"

          if [ -n "${CURRENT_REPO}" ] && [ "${CURRENT_REPO}" != "${UPSTREAM_REPO}" ]; then
            echo "[INFO] Running on fork/clone: ${CURRENT_REPO}. Checking distance from ${UPSTREAM_REPO}..."
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
            if git fetch --no-tags --depth=100 upstream main 2>/dev/null || git fetch --no-tags --depth=100 upstream master 2>/dev/null; then
              UPSTREAM_BRANCH="upstream/main"
              if ! git rev-parse --verify "${UPSTREAM_BRANCH}" >/dev/null 2>&1; then
                UPSTREAM_BRANCH="upstream/master"
              fi
              # Commits on upstream that are not in current HEAD
              BEHIND_COUNT=$(git rev-list --count HEAD..${UPSTREAM_BRANCH} 2>/dev/null || echo "0")
              echo "[INFO] Commits behind upstream: ${BEHIND_COUNT}"
            else
              echo "[WARN] Could not fetch upstream repository. Defaulting behind_count to 0."
              BEHIND_COUNT=0
            fi
          else
            echo "[INFO] Primary repository detected (${CURRENT_REPO}). Setting behind_count to 0."
            BEHIND_COUNT=0
          fi

          {
            echo "tag: \"${TAG_NAME}\""
            echo "commit: \"${SHORT_COMMIT}\""
            echo "build_date: \"${BUILD_DATE}\""
            echo "commit_count: ${COMMIT_COUNT}"
            echo "behind_count: ${BEHIND_COUNT}"
          } > _data/version.yml

          echo "[INFO] Generated version.yml successfully:"
          cat _data/version.yml

      - name: Setup GitHub Pages Metadata
        uses: actions/configure-pages@v5

      - name: Build Site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          future: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
